<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#3CBE6B"/>
  <!-- Isometric 3D arrow / cube mark -->
  <!-- Top face (bright white) -->
  <polygon points="100,48 158,80 100,112 42,80" fill="white"/>
  <!-- Right face (medium — slightly darker) -->
  <polygon points="100,112 158,80 158,120 100,152" fill="rgba(255,255,255,0.55)"/>
  <!-- Left face (darkest face) -->
  <polygon points="42,80 100,112 100,152 42,120" fill="rgba(255,255,255,0.30)"/>
</svg>
