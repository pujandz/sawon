<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" width="360" height="240">
  <rect width="360" height="240" fill="#000"/>
  <!--
    Flowing "an" / infinity-style lettermark.
    Left loop = open circle/C form. Right loop = arch/N form.
    Thick rounded white stroke, connected at centre.
    Stroke-width 28, no fill, rounded caps/joins.
  -->
  <g fill="none" stroke="white" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left "c/o" loop -->
    <path d="
      M 175,120
      C 175,68 140,36 100,36
      C 58,36 24,70 24,120
      C 24,170 58,204 100,204
      C 130,204 155,186 168,158
    "/>
    <!-- Right "n" arch — connects from centre, arches up and comes back down -->
    <path d="
      M 185,158
      C 198,186 223,204 256,204
      C 256,204 256,204 256,120
      L 256,60
    "/>
  </g>
</svg>
