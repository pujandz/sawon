name: Mirror to pujandz/sawon

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Debug secret
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          echo "Token length: ${#MIRROR_TOKEN}"
          echo -n "$MIRROR_TOKEN" | md5sum
