name: Mirror to pujandz/sawon

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, all branches)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror to pujandz/sawon
        env:
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
        run: |
          git remote add mirror "https://pujandz:${MIRROR_TOKEN}@github.com/pujandz/sawon.git"
          git push mirror --all --force
          git push mirror --tags --force
